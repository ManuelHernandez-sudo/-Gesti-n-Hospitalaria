<div class="pacientes-container">
  <div class="header">
    <h2>Pacientes</h2>
    <a routerLink="/pacientes/nuevo" class="btn-primary">+ Nuevo paciente</a>
  </div>

  <p *ngIf="cargando">Cargando...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <table *ngIf="!cargando && !error">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>CUI</th>
        <th>Fecha nacimiento</th>
        <th>Tipo sangre</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of pacientes">
        <td>{{ p.nombre }} {{ p.apellido }}</td>
        <td>{{ p.cui }}</td>
        <td>{{ p.fecha_nacimiento }}</td>
        <td>{{ p.tipo_sangre }}</td>
        <td>{{ p.telefono }}</td>
        <td>
          <a [routerLink]="['/pacientes', p.id, 'editar']">Editar</a>
          <button (click)="eliminar(p.id!)">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="pacientes.length === 0">
        <td colspan="6">No hay pacientes registrados todavía.</td>
      </tr>
    </tbody>
  </table>
</div>
